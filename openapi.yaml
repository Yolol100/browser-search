openapi: 3.1.0
info:
  title: Browser Search
  version: 0.2.0
  description: Bounded Google browser-search bridge. Stops on consent ambiguity, CAPTCHA, or automated-traffic blocks.
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Process health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, service, provider]
                properties:
                  ok: {type: boolean}
                  service: {const: browser-search}
                  provider: {const: google-browser}
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Chromium runtime is installed
        '503':
          description: Chromium runtime is unavailable
  /v1/search:
    post:
      operationId: browserSearch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/search-request.schema.json'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: './schemas/search-response.schema.json'
        '400': {description: Invalid request}
        '401': {description: Invalid bearer token}
        '409': {description: Consent decision required or unresolved}
        '413': {description: Request body too large}
        '415': {description: Content-Type is not application/json}
        '429': {description: Local queue/backoff or Google automated/unusual traffic block}
        '502': {description: Upstream layout/navigation failure}
        '503': {description: Browser runtime unavailable}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

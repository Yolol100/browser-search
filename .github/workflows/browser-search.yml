name: Browser search request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: browser-search
  cancel-in-progress: false

jobs:
  search:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[browser-search]')
    runs-on: [self-hosted, browser-search]
    timeout-minutes: 10
    env:
      GOOGLE_CONSENT_MODE: reject
      GOOGLE_DEFAULT_COUNTRY: nl
      GOOGLE_COOLDOWN_MS: 12000
      GOOGLE_BLOCK_BACKOFF_MS: 900000
      GOOGLE_MAX_RESULTS: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Run search and return result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-search-request.mjs

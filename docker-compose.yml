services:
  browser-search:
    build: .
    environment:
      BROWSER_SEARCH_HOST: 0.0.0.0
      BROWSER_SEARCH_PORT: 8787
      BROWSER_SEARCH_TOKEN: ${BROWSER_SEARCH_TOKEN:?set a token of at least 24 characters}
      GOOGLE_CONSENT_MODE: ${GOOGLE_CONSENT_MODE:-manual}
      GOOGLE_COOLDOWN_MS: ${GOOGLE_COOLDOWN_MS:-12000}
      GOOGLE_BLOCK_BACKOFF_MS: ${GOOGLE_BLOCK_BACKOFF_MS:-900000}
      GOOGLE_DEFAULT_COUNTRY: ${GOOGLE_DEFAULT_COUNTRY:-nl}
    ports:
      - "127.0.0.1:8787:8787"
    init: true
    shm_size: 1gb
    restart: unless-stopped
